<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Sumit · Agent Skills · single image</title>
<!-- DevCommX Brand Book v3.1 single-image post, 1080 x 1080.
     Ink surface, hatch from the top-right only, sky kicker, one line front and centre,
     source bottom-left, mono footer. The top-left logo zone is left EMPTY on purpose:
     drop the supplied white logo file there (never redraw it). -->
<style>
  :root {
    --ink: #0C0F1A; --white: #FFFFFF; --sky: #8CB0FF;
    --display: "Inter", "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  html, body { margin: 0; padding: 0; background: var(--ink); }
  .card {
    position: relative; width: 1080px; height: 1080px; overflow: hidden;
    background: var(--ink); color: var(--white);
    font-family: var(--display); -webkit-font-smoothing: antialiased;
  }
  /* 03 · diagonal hatch, accent only, fades in from the top-right corner */
  .hatch {
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 1px, transparent 1px 7px);
    -webkit-mask-image: linear-gradient(225deg, #000 0%, transparent 52%);
            mask-image: linear-gradient(225deg, #000 0%, transparent 52%);
  }
  /* logo clear zone: top-left, left empty for the supplied white logo */
  .logo-zone { position: absolute; left: 96px; top: 96px; width: 220px; height: 52px; }

  .body { position: absolute; left: 96px; right: 96px; top: 340px; }
  .kicker {
    font: 600 22px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
    color: var(--sky); margin: 0 0 40px;
  }
  .line {
    font: 800 98px/1.04 var(--display); letter-spacing: -.03em; margin: 0; white-space: nowrap;
  }
  .line .key { color: var(--sky); }
  .support {
    margin: 56px 0 0; max-width: 860px; text-wrap: balance;
    font: 500 34px/1.38 var(--display); color: rgba(255,255,255,.84);
  }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--sky); font-weight: 600; }

  .foot {
    position: absolute; left: 96px; right: 96px; bottom: 84px;
    border-top: 1px solid rgba(255,255,255,.16); padding-top: 26px;
    display: flex; justify-content: space-between; gap: 24px;
    font: 400 19px/1.3 var(--mono); letter-spacing: .04em; color: rgba(255,255,255,.58);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="hatch"></div>
    <div class="logo-zone" aria-hidden="true"></div>

    <div class="body">
      <p class="kicker">Agent Skills · now an open standard</p>
      <h1 class="line"><span class="key">Own the playbook.</span><br>Rent the model.</h1>
      <p class="support">Anthropic handed Agent Skills to the Agentic AI Foundation. <span class="num">70+</span> agent platforms already read the format.</p>
    </div>

    <div class="foot">
      <span>Source: Anthropic, Oct 22 2026</span>
      <span>devcommx.com · Go-to-market, made simple</span>
    </div>
  </div>
</body>
</html>
