<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Sumit · The nine-agent GTM team · image card</title>
<!-- Single-image card for Sumit's "nine agents, one job each" post, 1080 x 1350.
     Layout echoes a light page + dark app panel; no Mio, Slack, Grok or DevCommX branding. -->
<style>
  :root {
    --bg: #F4F1EA; --ink: #1E1F24; --muted: #7A7468; --panel: #17181D; --panel2: #202228; --row: #23252C;
    --line: #2E3038; --txt: #ECEAE4; --dim: #9C9A93; --human: #F2B45A; --terra: #C8603F;
    --serif: "Bitstream Charter", "Charter", Georgia, serif; --sans: "Inter", Arial, sans-serif; --mono: "JetBrains Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  .card { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  h1 { position: absolute; top: 64px; left: 0; right: 0; margin: 0; text-align: center; font: 400 74px/1.05 var(--serif); letter-spacing: -1.5px; }
  .sub { position: absolute; top: 160px; left: 0; right: 0; text-align: center; font: 400 23px/1.3 var(--sans); color: var(--muted); }
  .panel { position: absolute; top: 226px; left: 56px; width: 968px; height: 940px; border-radius: 22px; background: var(--panel); box-shadow: 0 24px 50px rgba(30,25,15,.22); overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 14px; height: 74px; padding: 0 26px; background: var(--panel2); border-bottom: 1px solid var(--line); color: var(--txt); }
  .bar .app { width: 34px; height: 34px; border-radius: 9px; background: #fff; display: grid; place-items: center; }
  .bar .app i { width: 14px; height: 14px; border-radius: 4px; background: var(--panel); display: block; }
  .bar b { font: 600 20px/1 var(--sans); }
  .bar .dots { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .bar .dots span { width: 20px; height: 20px; border-radius: 50%; display: inline-block; }
  .bar .live { margin-left: 12px; font: 600 14px/1 var(--mono); color: var(--dim); letter-spacing: .5px; }
  .rows { padding: 14px 18px; }
  .r { display: grid; grid-template-columns: 54px 236px 1fr auto; align-items: center; gap: 14px; height: 84px; padding: 0 16px; border-radius: 14px; background: var(--row); margin-bottom: 8px; color: var(--txt); }
  .r:last-child { margin-bottom: 0; }
  .ic { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; font: 700 18px/1 var(--mono); color: #17181D; }
  .nm { font: 600 21px/1.15 var(--sans); }
  .nm small { display: block; font: 500 12.5px/1 var(--mono); color: var(--dim); letter-spacing: .6px; margin-top: 7px; }
  .job { font: 400 16.5px/1.35 var(--sans); color: #CFCCC4; }
  .tag { padding: 7px 11px; border-radius: 8px; font: 700 12px/1 var(--mono); letter-spacing: .8px; white-space: nowrap; }
  .tag.h { background: rgba(242,180,90,.16); color: var(--human); border: 1px solid rgba(242,180,90,.45); }
  .tag.k { background: rgba(110,200,150,.14); color: #7FD3A2; border: 1px solid rgba(110,200,150,.4); }
  .foot { position: absolute; left: 56px; right: 56px; bottom: 50px; display: flex; align-items: center; justify-content: space-between; }
  .who { display: flex; align-items: center; gap: 14px; }
  .av { width: 52px; height: 52px; border-radius: 50%; background: var(--terra); color: #fff; display: grid; place-items: center; font: 700 17px/1 var(--sans); }
  .who b { display: block; font: 700 20px/1.2 var(--sans); }
  .who span { font: 400 15px/1.2 var(--sans); color: var(--muted); }
  .rule { font: 400 26px/1.2 var(--serif); font-style: italic; color: var(--ink); }
</style>
</head>
<body>
<div class="card">
  <h1>The nine-agent GTM team</h1>
  <div class="sub">One job each, from ICP to booked call · three places a person signs</div>

  <div class="panel">
    <div class="bar">
      <div class="app"><i></i></div><b>Outbound</b>
      <div class="dots" id="dots"></div><span class="live">9 agents · 3 sign-offs</span>
    </div>
    <div class="rows" id="rows"></div>
  </div>

  <div class="foot">
    <div class="who"><div class="av">SN</div><div><b>Sumit Nautiyal</b><span>Go-to-market leader</span></div></div>
    <div class="rule">Agents do the typing. People keep the judgment.</div>
  </div>
</div>
<script>
const C = ['#F2C14E','#7FD3A2','#7FB7F2','#F28F7F','#C9A6F2','#F2A65A','#6FD6D0','#E7E07A','#F28FC0'];
const A = [
  ['ICP picker', 'Ranks two or three ICPs by fit and past wins', 'h', 'A PERSON PICKS'],
  ['Signal watcher', 'Funding, hiring, leadership and tool changes, each dated', '', ''],
  ['Researcher', 'Reads site, customer stories, reviews; scores fit', '', ''],
  ['Buyer mapper', 'Finds who signs, who uses, who blocks', '', ''],
  ['First-touch writer', 'Starts from a campaign angle; no meeting ask in email one', 'h', 'A PERSON APPROVES'],
  ['Follow-up writer', 'A new reason at every step', '', ''],
  ['Reply sorter', 'Tags interested, not now or no; drafts a response', 'h', 'A PERSON ANSWERS'],
  ['CRM keeper', 'Merges duplicate contacts and companies', '', ''],
  ['Closed-lost reviver', 'Re-reads lost deals for what changed since', 'k', '~$380K FROM OUR CLOSED-LOST'],
];
document.getElementById('dots').innerHTML = C.map(c => `<span style="background:${c}"></span>`).join('');
document.getElementById('rows').innerHTML = A.map((a, i) =>
  `<div class="r"><div class="ic" style="background:${C[i]}">${i + 1}</div>` +
  `<div class="nm">${a[0]}<small>AGENT ${String(i + 1).padStart(2, '0')}</small></div>` +
  `<div class="job">${a[1]}</div>` +
  (a[2] ? `<div class="tag ${a[2]}">${a[3]}</div>` : '<div></div>') + `</div>`).join('');
</script>
</body>
</html>
