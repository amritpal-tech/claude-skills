<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Sumit · shared revenue definitions · animated</title>
<!-- Animated card for Sumit's "Marketing: Pipeline is up. / Sales: Which pipeline?" post.
     1080 x 1350, 10 s seamless loop, warm illustrated style (same as his Fable factory GIF).
     Story: two teams, one word, two answers -> three definitions get an owner and a review
     date -> the agent gives one answer. All charts are illustrative: no numbers on the card.
     window.render(t) draws the frame at t seconds for deterministic capture. -->
<style>
  html, body { margin: 0; padding: 0; background: #F5E9DE; }
  svg { display: block; }
  text { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; }
  .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"></svg>
<script>
const K = {
  bg:'#F5E9DE', ink:'#2B211C', muted:'#8C7768', terra:'#B4533A', terraD:'#8A3D2C', wall:'#A64B36',
  brick:'#BC5F45', brickL:'#A34F3A', floor:'#EFE2D3', tile:'#E4D4C1', card:'#FFFDF9', cardB:'#E8D9C8',
  wood:'#E3BE99', woodL:'#F2DCC4', dark:'#3A2019', red:'#D8573B', redBg:'#FBE3DC', green:'#2F9E5B', greenBg:'#DDF1E4'
};
const LOOP = 10;
const rr = (x,y,w,h,r,fill,ex='') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" ${ex}/>`;
const ci = (x,y,r,fill,ex='') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${ex}/>`;
const tx = (x,y,s,size,fill,ex='') => `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" ${ex}>${s}</text>`;

function human(id, cx, hy, skin, hair, shirt, o = {}) {
  let s = `<g id="${id}">`;
  s += rr(cx-27, hy+18, 54, 46, 15, shirt);
  s += `<rect x="${cx-5}" y="${hy+10}" width="10" height="11" fill="${skin}"/>`;
  if (o.bun) s += ci(cx, hy-19, 7, hair);
  s += ci(cx, hy, 17, skin);
  s += `<path d="M${cx-17.5},${hy-1} a17.5,17.5 0 0 1 35,0 q-17.5,-11 -35,0z" fill="${hair}"/>`;
  s += ci(cx-6, hy+2, 2, K.ink) + ci(cx+6, hy+2, 2, K.ink);
  s += `<path id="${id}_m" d="M${cx-4.5},${hy+9} q4.5,3 9,0" stroke="${K.ink}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  if (o.glasses) s += `<g fill="none" stroke="${K.ink}" stroke-width="1.4"><circle cx="${cx-6}" cy="${hy+2}" r="5"/><circle cx="${cx+6}" cy="${hy+2}" r="5"/></g>`;
  return s + '</g>';
}
function bubble(id, x, y, w, text, side) {    // side: 'l' tail bottom-left, 'r' tail bottom-right
  const tail = side === 'l' ? `M${x+34},${y+50} l-6,16 l20,-16z` : `M${x+w-34},${y+50} l6,16 l-20,-16z`;
  return `<g id="${id}">${rr(x,y,w,52,14,K.card,`stroke="${K.cardB}" stroke-width="1.5"`)}<path d="${tail}" fill="${K.card}" stroke="${K.cardB}" stroke-width="1.5" stroke-linejoin="round"/>${rr(x+1,y+40,w-2,11,10,K.card)}${tx(x+w/2,y+33,text,22,K.ink,'text-anchor="middle" font-weight="500"')}</g>`;
}
function report(id, cx, cy, label, bars, color) {
  let s = `<g id="${id}">` + rr(cx-105, cy-62, 210, 124, 12, K.card, `stroke="${K.cardB}" stroke-width="1.5"`);
  s += tx(cx-88, cy-36, label, 12.5, K.muted, 'class="mono" font-weight="600" letter-spacing="1.2"');
  bars.forEach((h, i) => { s += rr(cx-82 + i*42, cy+44-h, 28, h, 4, color, `class="bar" data-h="${h}"`); });
  s += `<path d="M${cx-90},${cy+45} H${cx+90}" stroke="${K.cardB}" stroke-width="1.5"/>`;
  return s + '</g>';
}
function defcard(i, x, y, title) {
  let s = `<g id="def${i}">` + rr(x, y, 226, 272, 12, K.card, `id="defbox${i}" stroke="${K.cardB}" stroke-width="2"`);
  s += rr(x, y, 226, 46, 12, '#F3E6D6') + rr(x, y+30, 226, 16, 0, '#F3E6D6');
  s += tx(x+113, y+30, title, 17, K.ink, 'text-anchor="middle" class="mono" font-weight="700" letter-spacing="1.5"');
  ['Meaning, written', 'Owner, named', 'Reviewed, dated'].forEach((r, j) => {
    const ry = y + 70 + j*50;
    s += rr(x+16, ry, 26, 26, 6, '#fff', `stroke="#D7C1AA" stroke-width="1.5"`);
    s += `<path id="tick${i}_${j}" d="M${x+22},${ry+13} l5,5 l9,-10" fill="none" stroke="${K.green}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>`;
    s += tx(x+54, ry+19, r, 17, K.ink);
  });
  s += `<g id="seal${i}" opacity="0"><g transform="rotate(-6 ${x+113} ${y+238})">${rr(x+43,y+221,140,34,8,'#EEF8F1',`stroke="${K.green}" stroke-width="2.5"`)}${tx(x+113,y+244,'SIGNED OFF',16,K.green,'text-anchor="middle" class="mono" font-weight="700" letter-spacing="1.5"')}</g></g>`;
  return s + '</g>';
}

// ---------- scene ----------
let S = `<defs>
  <pattern id="bricks" width="44" height="28" patternUnits="userSpaceOnUse"><rect width="44" height="28" fill="${K.brick}"/><path d="M0,0 H44 M0,14 H44 M0,0 V14 M22,14 V28" stroke="${K.brickL}" stroke-width="1.6"/></pattern>
  <pattern id="tiles" width="56" height="56" patternUnits="userSpaceOnUse"><rect width="56" height="56" fill="${K.floor}"/><path d="M0,0 H56 M0,0 V56" stroke="${K.tile}" stroke-width="1.5"/></pattern>
  <clipPath id="room"><rect x="92" y="206" width="896" height="1000"/></clipPath>
</defs>`;
S += rr(0,0,1080,1350,0,K.bg);

// header
S += rr(372,30,336,34,17,'none',`stroke="${K.terra}" stroke-width="1.3"`) + tx(540,52.5,'AI agents · revenue definitions',15,K.terra,'text-anchor="middle" font-weight="500"');
S += `<text x="540" y="130" font-size="62" font-weight="300" letter-spacing="-1.8" fill="${K.ink}" text-anchor="middle">One question. <tspan fill="${K.terra}" font-weight="400">Two answers.</tspan></text>`;
S += `<text x="540" y="176" font-size="24" fill="${K.muted}" text-anchor="middle">Until someone <tspan fill="${K.terra}" font-weight="600">owns the definition.</tspan></text>`;

// room
S += rr(36,206,1008,1000,20,K.wall) + rr(84,206,8,1000,0,K.terraD) + rr(988,206,8,1000,0,K.terraD);
S += `<g clip-path="url(#room)">` + rr(92,206,896,1000,0,'url(#tiles)') + rr(92,206,896,96,0,'url(#bricks)') + rr(92,206,896,10,0,'#4A241B') + rr(92,296,896,6,0,K.terraD) + `</g>`;
[124,270,684,830].forEach(x => { S += rr(x-4,226,130,58,5,K.dark) + rr(x,230,122,50,3,'#FDF3E1') + `<path d="M${x+40.7},230 V280 M${x+81.3},230 V280 M${x},255 H${x+122}" stroke="${K.dark}" stroke-width="3.5"/>`; });
S += rr(426,226,228,58,8,K.dark) + rr(432,232,216,46,5,'#4A2A20');
S += tx(540,255,'REVENUE ROOM',16,'#F6E7D4','text-anchor="middle" class="mono" font-weight="600" letter-spacing="1.5"');
S += tx(540,271,'ONE WORD, ONE MEANING',9.5,'#D9A48F','text-anchor="middle" class="mono" letter-spacing="1.8"');
S += `<path d="M103,312 V1196 M977,312 V1196" stroke="#E9B949" stroke-width="3" stroke-dasharray="14 10" opacity=".85"/>`;

// row A: marketing, the agent, sales
S += rr(120,420,236,170,12,'#F5D3D2') + rr(724,420,236,170,12,'#C9E6DC') + rr(392,420,296,170,12,'#D5E0F5');
S += human('mkt', 210, 476, '#F1C9A5', '#7A3E2A', '#C2566A', { bun: true });
S += rr(150,522,170,13,4,K.wood) + rr(156,534,158,40,3,K.woodL) + rr(206,548,58,15,3,'#fff',`stroke="${K.cardB}"`) + tx(235,559,'MARKETING',8.5,K.muted,'text-anchor="middle" class="mono"');
S += human('sls', 870, 476, '#8D5B3F', '#1E1714', '#2F8F83', { glasses: true });
S += rr(760,522,170,13,4,K.wood) + rr(766,534,158,40,3,K.woodL) + rr(816,548,58,15,3,'#fff',`stroke="${K.cardB}"`) + tx(845,559,'SALES',8.5,K.muted,'text-anchor="middle" class="mono"');
// the agent
S += `<g id="agent">`;
S += rr(500,500,80,52,16,'#D9683F') + rr(526,512,28,5,2.5,'#F0A27F');
S += `<line x1="540" y1="440" x2="540" y2="428" stroke="#FFF7EC" stroke-width="3"/>` + ci(540,425,5.5,'#F2B84B','id="ant"');
S += rr(492,458,8,18,3,'#E5D8C8') + rr(580,458,8,18,3,'#E5D8C8');
S += rr(498,440,84,64,22,'#FFF7EC') + rr(509,452,62,38,13,'#16302E');
S += `<g id="eyesQ">${tx(540,480,'?',26,'#FFB59E','text-anchor="middle" font-weight="700"')}</g>`;
S += `<g id="eyesOK" opacity="0">${rr(523,462,8,13,4,'#9BF0D0')}${rr(549,462,8,13,4,'#9BF0D0')}<path d="M532,482 q8,5 16,0" stroke="#9BF0D0" stroke-width="2" fill="none" stroke-linecap="round"/></g>`;
S += `</g>`;
S += rr(452,552,176,13,4,K.wood) + rr(458,564,164,24,3,K.woodL);
// speech bubbles
S += bubble('bL', 124, 328, 230, 'Pipeline is up.', 'l');
S += bubble('bR', 726, 328, 230, 'Which pipeline?', 'r');
S += `<g id="bR2" opacity="0">${rr(726,328,230,52,14,'#E3F4EA',`stroke="#A9D9B9" stroke-width="1.5"`)}<path d="M922,378 l6,16 l-20,-16z" fill="#E3F4EA" stroke="#A9D9B9" stroke-width="1.5" stroke-linejoin="round"/>${rr(727,368,228,11,10,'#E3F4EA')}${tx(841,361,'Same pipeline.',22,K.ink,'text-anchor="middle" font-weight="500"')}</g>`;
S += `<g id="ask">${rr(430,330,220,46,23,K.dark)}${tx(540,359,'"What\'s our pipeline?"',17,'#F6E7D4','text-anchor="middle" font-weight="500"')}</g>`;

// row B: the answers
S += rr(120,610,840,178,12,'#EDE3F6');
S += tx(140,640,'WHAT THE AGENT ANSWERS',12.5,'#6C55B8','class="mono" font-weight="700" letter-spacing="1.6"');
S += report('rA', 270, 712, 'ANSWER A', [52,70,92,0].slice(0,3), '#C2566A');
S += report('rB', 810, 712, 'ANSWER B', [30,22,38], '#2F8F83');
S += `<g id="neq">${ci(540,712,30,K.redBg,`stroke="${K.red}" stroke-width="2"`)}${tx(540,724,'≠',34,K.red,'text-anchor="middle" font-weight="700"')}</g>`;
S += `<g id="one" opacity="0">${rr(415,650,250,124,12,K.card,`stroke="#A9D9B9" stroke-width="2"`)}${tx(432,676,'ONE ANSWER',12.5,K.green,'class="mono" font-weight="700" letter-spacing="1.2"')}${ci(642,672,11,K.green)}<path d="M637,672 l3.5,3.5 l6.5,-7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${rr(440,714,28,42,4,K.green)}${rr(482,700,28,56,4,K.green)}${rr(524,688,28,68,4,K.green)}${rr(566,706,28,50,4,K.green)}<path d="M430,757 H650" stroke="${K.cardB}" stroke-width="1.5"/></g>`;
S += tx(940,776,'Illustrative',11,K.muted,'text-anchor="end" font-style="italic"');

// row C: the definitions board
S += rr(120,808,840,380,14,'#FBF4EC',`stroke="${K.cardB}" stroke-width="1.5"`);
S += tx(144,850,'Settle three definitions',26,K.ink,'font-weight="500" letter-spacing="-0.4"');
S += tx(940,849,'before any agent answers',15,K.muted,'text-anchor="end"');
S += defcard(0, 148, 880, 'PIPELINE');
S += defcard(1, 427, 880, 'QUALIFIED');
S += defcard(2, 706, 880, 'ATTRIBUTION');
S += `<g id="stamp">${rr(-7,-34,14,22,5,'#4B3A8C')}${rr(-16,-14,32,15,5,'#6C55B8')}</g>`;

// numbered labels for rows A and B

// footer
S += ci(74,1272,25,K.terra) + tx(74,1278,'SN',16,'#fff','text-anchor="middle" font-weight="600"');
S += tx(112,1269,'Sumit Nautiyal',22,K.ink,'font-weight="500"') + tx(112,1291,'DevCommX',14,K.muted);
S += rr(300,1242,480,58,29,K.terra) + tx(326,1278,'Only as consistent as',19,'#fff');
S += rr(546,1251,224,40,20,K.card) + tx(658,1277,'your definitions',19,K.terra,'text-anchor="middle" font-weight="700"');
S += tx(1044,1266,'Point from Snowflake\'s',12.5,K.muted,'text-anchor="end"') + tx(1044,1283,'Expedition 2026 recap',12.5,K.muted,'text-anchor="end"');

document.getElementById('s').innerHTML = S;

// ---------- animation ----------
const $ = id => document.getElementById(id);
const clamp = x => Math.min(1, Math.max(0, x));
const ramp = (t,a,b) => clamp((t-a)/(b-a));
const ease = x => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2,3)/2; };
const SIGN = [2.5, 3.6, 4.7];                       // when each card is signed off
const CARD_X = [148+113, 427+113, 706+113];
const barsA = [...$('rA').querySelectorAll('.bar')], barsB = [...$('rB').querySelectorAll('.bar')];

window.render = function (t) {
  t = ((t % LOOP) + LOOP) % LOOP;
  const back = ease(ramp(t, 9.2, 9.9));             // last 0.7 s: return to the opening state
  const keep = 1 - back;

  // the agent's question and the two answers (opening state = conflict, the poster frame)
  const m = ease(ramp(t, 6.0, 6.8)) * keep;         // merge two answers into one
  $('rA').setAttribute('transform', `translate(${270 * m * 1},0)`);
  $('rB').setAttribute('transform', `translate(${-270 * m},0)`);
  $('rA').setAttribute('opacity', 1 - ramp(m, .55, 1));
  $('rB').setAttribute('opacity', 1 - ramp(m, .55, 1));
  $('one').setAttribute('opacity', ramp(m, .6, 1));
  $('neq').setAttribute('opacity', 1 - ramp(m, 0, .35));
  // bars wobble while the agent can't decide
  const unsure = keep * (1 - ramp(t, 5.6, 6.0));
  [[barsA, 0], [barsB, .5]].forEach(([bars, ph]) => bars.forEach((b, i) => {
    const h0 = +b.dataset.h, h = h0 * (1 + .12 * unsure * Math.sin(2 * Math.PI * (t * 1.2 + ph + i * .3)));
    b.setAttribute('height', h.toFixed(1)); b.setAttribute('y', (756 - h).toFixed(1));
  }));

  // three definitions get signed off, one by one; a stamp travels between them
  for (let i = 0; i < 3; i++) {
    const k = ease(ramp(t, SIGN[i], SIGN[i] + .35)) * keep;
    for (let j = 0; j < 3; j++) $(`tick${i}_${j}`).setAttribute('opacity', ease(ramp(t, SIGN[i] - .5 + j * .15, SIGN[i] - .35 + j * .15)) * keep);
    $(`seal${i}`).setAttribute('opacity', k);
    $(`defbox${i}`).setAttribute('stroke', k > .5 ? '#7FCB97' : K.cardB);
  }
  let sx = CARD_X[0], sy = 1078, press = 0, so = 0;
  if (t > 1.9 && t < 5.4) {
    so = ramp(t, 1.9, 2.1) * (1 - ramp(t, 5.1, 5.4));
    for (let i = 0; i < 3; i++) {
      const s0 = SIGN[i] - .55, s1 = SIGN[i];
      if (t >= s0) sx = i === 0 ? CARD_X[0] : CARD_X[i - 1] + (CARD_X[i] - CARD_X[i - 1]) * ease(ramp(t, s0, s0 + .4));
      if (t >= s1 - .05 && t < s1 + .2) press = 8;
    }
  }
  $('stamp').setAttribute('transform', `translate(${sx},${1102 + press})`);
  $('stamp').setAttribute('opacity', so);

  // bubbles: "Which pipeline?" turns into "Same pipeline." once the answer is one
  const agree = ease(ramp(t, 7.0, 7.4)) * keep;
  $('bR').setAttribute('opacity', 1 - agree); $('bR2').setAttribute('opacity', agree);
  $('ask').setAttribute('opacity', 1 - ease(ramp(t, 6.0, 6.4)) * keep);

  // the agent: puzzled until the definitions land, then settled
  $('eyesQ').setAttribute('opacity', 1 - m); $('eyesOK').setAttribute('opacity', m);
  $('agent').setAttribute('transform', `rotate(${((1 - m) * 3 * Math.sin(2 * Math.PI * t * .9)).toFixed(2)} 540 552)`);
  $('ant').setAttribute('fill', Math.sin(2 * Math.PI * t) > 0 ? '#F2B84B' : '#FFE08A');
  ['mkt','sls'].forEach((id, i) => $(id).setAttribute('transform', `translate(0,${(1.4 * Math.sin(2 * Math.PI * (t / 2.5 + i * .4))).toFixed(2)})`));
  $('sls_m').setAttribute('d', agree > .5 ? 'M864.5,485 q5.5,4 11,0' : 'M865.5,487 q4.5,-2 9,0');
};

window.render(0);
if (!location.hash.includes('capture')) {
  const t0 = performance.now();
  (function tick() { window.render((performance.now() - t0) / 1000); requestAnimationFrame(tick); })();
}
</script>
</body>
</html>
