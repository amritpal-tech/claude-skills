<!-- Illustrated "factory floor" flow for LinkedIn, 1080 x 1350, 6 s seamless loop.
     Warm editorial palette on request (not the dark DevCommX brand surface).
     Original illustration: six stations joined by conveyor belts.
       1 Ops desk -> 2 Budget office -> 3 Fable 5.2 lead agent -> 4 Subagent floor
       -> 5 Check-in (a named person signs off) -> 6 Team floor
     window.render(t) draws the frame at t seconds so frames can be captured
     deterministically. Opened in a browser, it plays in real time. -->
<style>
  html, body { margin: 0; padding: 0; background: #F5E9DE; }
  svg { display: block; }
  text { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; }
  .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"></svg>
<script>
const K = {
  bg:'#F5E9DE', ink:'#2B211C', muted:'#8C7768', terra:'#B4533A', terraD:'#8A3D2C', wall:'#A64B36',
  brick:'#BC5F45', brickL:'#A34F3A', floor:'#EFE2D3', tile:'#E4D4C1', card:'#FFFDF9', cardB:'#E8D9C8',
  rail:'#C4826C', belt:'#F3D3C4', roller:'#E0AC98', wood:'#E3BE99', woodD:'#C99A72', woodL:'#F2DCC4', dark:'#3A2019'
};
const V = 70, SP = 2, LOOP = 6;           // belt speed px/s, seconds between parcels, loop length

const rr = (x,y,w,h,r,fill,ex='') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" ${ex}/>`;
const ci = (x,y,r,fill,ex='') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${ex}/>`;
const tx = (x,y,s,size,fill,ex='') => `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" ${ex}>${s}</text>`;

function rpath(p, r = 24) {
  let d = `M${p[0][0]},${p[0][1]}`;
  for (let i = 1; i < p.length - 1; i++) {
    const [x0,y0] = p[i-1], [x1,y1] = p[i], [x2,y2] = p[i+1];
    const u = (a,b,c,e) => { const l = Math.hypot(c-a, e-b); return [(c-a)/l, (e-b)/l]; };
    const [ux,uy] = u(x1,y1,x0,y0), [vx,vy] = u(x1,y1,x2,y2);
    d += ` L${x1+ux*r},${y1+uy*r} Q${x1},${y1} ${x1+vx*r},${y1+vy*r}`;
  }
  const l = p[p.length-1];
  return d + ` L${l[0]},${l[1]}`;
}

// ---------- reusable pieces ----------
function card(x, y, w, n, title, desc, chips) {
  const h = chips ? 92 : 66;
  let s = rr(x, y, w, h, 10, K.card, `stroke="${K.cardB}" stroke-width="1"`);
  s += ci(x+23, y+24, 11, K.terra) + tx(x+23, y+28.5, n, 13, '#fff', 'text-anchor="middle" font-weight="600"');
  s += tx(x+42, y+31.5, title, 22, K.ink, 'font-weight="500" letter-spacing="-0.3"');
  s += tx(x+14, y+53, desc, 15, K.muted);
  if (chips) { let cx = x+14; chips.forEach(c => { const cw = c.length*6.3+16;
    s += rr(cx, y+64, cw, 19, 9.5, '#ECE7FA') + tx(cx+cw/2, y+77.5, c, 11, '#5A47A8', 'text-anchor="middle" font-weight="500"'); cx += cw+6; }); }
  return s;
}
function human(id, cx, hy, skin, hair, shirt, o = {}) {
  let s = `<g id="${id}">`;
  s += rr(cx-21, hy+14, 42, 36, 12, shirt);
  s += `<rect x="${cx-4}" y="${hy+8}" width="8" height="9" fill="${skin}"/>`;
  if (o.bun) s += ci(cx, hy-15, 5.5, hair);
  s += ci(cx, hy, 13, skin);
  s += `<path d="M${cx-13.5},${hy-1} a13.5,13.5 0 0 1 27,0 q-13.5,-9 -27,0z" fill="${hair}"/>`;
  s += ci(cx-4.5, hy+2, 1.6, K.ink) + ci(cx+4.5, hy+2, 1.6, K.ink);
  s += `<path d="M${cx-3.5},${hy+7} q3.5,2.6 7,0" stroke="${K.ink}" stroke-width="1.3" fill="none" stroke-linecap="round"/>`;
  if (o.glasses) s += `<g fill="none" stroke="${K.ink}" stroke-width="1.2"><circle cx="${cx-4.5}" cy="${hy+2}" r="4"/><circle cx="${cx+4.5}" cy="${hy+2}" r="4"/></g>`;
  return s + '</g>';
}
function bot(id, cx, hy, body, accent) {       // small subagent bot; hy = top of head
  let s = `<g id="${id}">`;
  s += rr(cx-17, hy+27, 34, 34, 9, body);
  s += `<line x1="${cx}" y1="${hy}" x2="${cx}" y2="${hy-7}" stroke="${K.dark}" stroke-width="2"/>` + ci(cx, hy-9, 3.2, accent, `class="ant"`);
  s += rr(cx-19, hy+9, 4, 9, 2, '#C9D3EC') + rr(cx+15, hy+9, 4, 9, 2, '#C9D3EC');
  s += rr(cx-15, hy, 30, 26, 9, '#F7F9FF');
  s += rr(cx-11, hy+6, 22, 13, 5, '#26355F');
  s += rr(cx-7, hy+10, 4, 5, 1.5, '#A9ECFF', 'class="eye"') + rr(cx+3, hy+10, 4, 5, 1.5, '#A9ECFF', 'class="eye"');
  return s + '</g>';
}
function desk(x, y, w, frontH, plate) {          // y = desk top
  let s = rr(x+3, y+8, w-6, frontH, 3, K.woodL) + rr(x, y, w, 9, 3, K.wood);
  if (plate) s += rr(x+w/2-20, y+16, 40, 13, 3, '#fff', `stroke="${K.cardB}"`) + tx(x+w/2, y+26, plate, 8.5, K.muted, 'text-anchor="middle" class="mono"');
  return s;
}
function monitor(x, y, w, h, screen, inner = '') {
  return rr(x+w/2-4, y+h-1, 8, 5, 1, K.dark) + rr(x, y, w, h, 4, K.dark) + rr(x+3, y+3, w-6, h-7, 2, screen) + inner;
}

// ---------- belts ----------
const PA = rpath([[150,528],[150,1150],[520,1150],[520,886]]);
const PB = rpath([[370,672],[370,588],[900,588],[900,1150],[626,1150]]);
function belt(id) {

for (let i = 0; i < 7; i++) {

// ---------- animation ----------
const $ = id => document.getElementById(id);
const clamp = x => Math.min(1, Math.max(0, x));
const ramp = (t,a,b) => clamp((t-a)/(b-a));
const ease = x => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2,3)/2; };
const mix = (a,b,k) => { const p = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16)); const A = p(a), B = p(b);
  return '#' + A.map((v,i) => Math.round(v+(B[i]-v)*k).toString(16).padStart(2,'0')).join(''); };

const pA = $('pA'), pB = $('pB'), LA = pA.getTotalLength(), LB = pB.getTotalLength();
let sTag = 0, sG = 0;
for (let q = 0; q < LA; q += 1) { const p = pA.getPointAtLength(q); if (p.y > 1140 && p.x >= 300) { sTag = q; break; } }
for (let q = 0; q < LB; q += 1) { const p = pB.getPointAtLength(q); if (p.x > 890 && p.y >= 776) { sG = q; break; } }
const uG = sG / V, PAUSE = 0.9, TB = LB / V + PAUSE;
const envs = [...Array(NA)].map((_,j) => $('a'+j)), boxes = [...Array(NB)].map((_,j) => $('b'+j));
const panes = [...document.querySelectorAll('.pane')], stars = [...document.querySelectorAll('.stars')];

window.render = function (t) {
  t = ((t % LOOP) + LOOP) % LOOP;
  const ph = t % SP;

  // belts roll in the direction of travel
  const off = -((V * t) % 20);
  $('roll_pA').setAttribute('stroke-dashoffset', off); $('roll_pB').setAttribute('stroke-dashoffset', off);

  // briefs: ops -> budget (gets a budget tag) -> lead agent
  envs.forEach((g, j) => {
    const s = V * (ph + SP * j);
    if (s > LA) { g.setAttribute('display', 'none'); return; }
    const p = pA.getPointAtLength(s);
    g.removeAttribute('display'); g.setAttribute('transform', `translate(${p.x.toFixed(2)},${p.y.toFixed(2)})`);
    g.querySelector('.tag').setAttribute('display', s > sTag ? 'inline' : 'none');
  });
  // work packages: lead agent -> subagent floor -> check-in (held, then signed off) -> team
  boxes.forEach((g, j) => {
    const u = ph + SP * j;
    if (u > TB) { g.setAttribute('display', 'none'); return; }
    const s = u < uG ? V * u : u < uG + PAUSE ? sG : sG + V * (u - uG - PAUSE);
    const p = pB.getPointAtLength(Math.min(s, LB));
    g.removeAttribute('display'); g.setAttribute('transform', `translate(${p.x.toFixed(2)},${p.y.toFixed(2)})`);
    g.querySelector('.tick').setAttribute('display', u > uG + 0.42 ? 'inline' : 'none');
    g.setAttribute('opacity', 1 - ramp(s, LB - 40, LB - 22));
  });

  // check-in: stamp, light and barrier, once per package
  const f = (((t - uG) % SP) + SP) % SP;
  const go = ease(ramp(f, .2, .4)) * (1 - ease(ramp(f, .52, .78)));
  const press = (f > .4 && f < .52) ? 3 : 0;
  $('stamp').setAttribute('transform', `translate(${864 + 36 * go},${776 - 4 * go + press})`);
  const green = f >= .45 && f < 1.75;
  $('lampG').setAttribute('fill', green ? '#6EDC8C' : '#2A5A3A'); $('lampR').setAttribute('fill', green ? '#6B2A20' : '#FF5A3C');
  const up = ease(ramp(f, .5, .8)) * (1 - ease(ramp(f, 1.7, 1.9)));
  $('barrier').setAttribute('transform', `rotate(${78 * up} 937 807.5)`);

  // days pass: calendar, windows, plan progress, spend
  const day = Math.floor(t / 2) + 1, dph = (t % 2) / 2;
  const dn = $('daynum'), out = ramp(dph, .88, .94), inn = ramp(dph, .94, 1);
  dn.textContent = dph < .94 ? day : (day % 3) + 1;
  dn.setAttribute('opacity', dph < .94 ? 1 - out : inn);
  dn.setAttribute('y', dph < .94 ? 726 - 9 * ease(out) : 726 + 9 * (1 - ease(inn)));
  const night = .5 - .5 * Math.cos(2 * Math.PI * dph);
  panes.forEach(p => p.setAttribute('fill', mix('#FDF3E1', '#33406B', night)));
  stars.forEach(s => s.setAttribute('opacity', clamp((night - .55) / .3)));
  for (let i = 0; i < 4; i++) $('pl'+i).setAttribute('opacity', (1 - ramp(t, 5.75, 5.95)) * ramp(t, 1.1 * (i + 1), 1.1 * (i + 1) + .2));
  const spend = (10 + 50 * (t / 5.7)) * (1 - ease(ramp(t, 5.7, 5.98))) + 10 * ease(ramp(t, 5.7, 5.98));
  $('meter').setAttribute('width', Math.min(64, spend));

  // characters
  for (let i = 0; i < 7; i++) {
    const b = $('bot'+i), k = t / 2 + i * .17;
    b.setAttribute('transform', `translate(0,${(1.6 * Math.sin(2 * Math.PI * k)).toFixed(2)})`);
    b.querySelector('.ant').setAttribute('opacity', Math.sin(2 * Math.PI * (t + i * .31)) > 0 ? 1 : .35);
    [...$('scr'+i).children].forEach((r, n) => { const h = 5 + 7 * (.5 + .5 * Math.sin(2 * Math.PI * (t * 1.5 + i * .23 + n * .37)));
      r.setAttribute('height', h.toFixed(1)); r.setAttribute('y', (484 - h).toFixed(1)); });
  }
  ['h_ops','h_mgr','h_fin','h_t0','h_t1','h_t2'].forEach((id, i) =>
    $(id).setAttribute('transform', `translate(0,${(1.2 * Math.sin(2 * Math.PI * (t / 3 + i * .21))).toFixed(2)})`));
  $('lead').setAttribute('transform', `rotate(${(1.4 * Math.sin(2 * Math.PI * t / 3)).toFixed(2)} 430 850)`);
  const blink = (Math.abs(t - 1.5) < .09 || Math.abs(t - 4.5) < .09) ? .15 : 1;
  ['eyeL','eyeR'].forEach(id => { $(id).setAttribute('height', 14 * blink); $(id).setAttribute('y', 765 + 7 * (1 - blink)); });
  $('leadant').setAttribute('fill', Math.sin(2 * Math.PI * t) > 0 ? '#F2B84B' : '#FFE08A');
  [...$('briefdoc').children].forEach((l, n) => l.setAttribute('opacity', ramp(ph, .3 * n + .1, .3 * n + .35)));
};

window.render(0);
if (!location.hash.includes('capture')) {
  const t0 = performance.now();
  (function tick() { window.render((performance.now() - t0) / 1000); requestAnimationFrame(tick); })();
}
</script>
</body>
</html>
